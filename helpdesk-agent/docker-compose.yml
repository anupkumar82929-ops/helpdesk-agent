services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # read-only role created in db/init.sql, used ONLY by the MCP server
      MCP_DATABASE_URL: postgresql://mcp_reader:mcp_reader@db:5432/${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on your machine
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    command: sh -c "python -m app.ingest && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
